# Netlify config for Shrinqo (site base directory: linkshort-app/).
#
# The whole app is served from ONE function (netlify/functions/api.js) which
# reuses the exact same request handler as the standalone server. All paths are
# rewritten to that function; it interprets the original path itself.
#
# IMPORTANT (testing only): Netlify Functions are serverless + ephemeral. The
# SQLite DB is written to /tmp and is NOT durable across cold starts. Use this
# to test the UI/API. It is not a replacement for persistent multi-user storage.
#
# Node version: server.js uses node:sqlite (built-in) which requires Node 22+.
# Pin it via .nvmrc (see file) so the function runtime is new enough.

[build]
  command = "bash netlify/build-functions.sh"
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "zisi"

# Security headers for all static files served directly by CDN
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://quge5.com https://nap5k.com https://al5sm.com https://n6wxm.com https://5gvci.com https://6opo.com https://auqot.com https://ekhay.com https://b3mny.com https://ay267.com https://fonts.googleapis.com https://app.netlify.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://quge5.com https://nap5k.com https://al5sm.com https://n6wxm.com https://5gvci.com https://6opo.com https://e2ertt.com https://auqot.com https://ekhay.com https://b3mny.com https://ay267.com https://app.netlify.com; frame-src https://quge5.com https://nap5k.com https://al5sm.com https://n6wxm.com https://5gvci.com https://6opo.com https://auqot.com https://ekhay.com https://b3mny.com https://ay267.com https://app.netlify.com"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Redirect API + dynamic routes to the function.
# Without force=true, Netlify first checks for a static file in the publish dir.
# If a file exists (e.g. /index.html, /icon.svg, /custom.css), it's served
# directly. Only non-static paths (API routes, short-link IDs) hit the function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/dl/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api"
  status = 200

# Catch-all for non-existent static files (short link IDs like /g7I6Im)
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200
